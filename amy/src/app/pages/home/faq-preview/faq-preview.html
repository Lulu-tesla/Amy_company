<section class="section soft-band">
  <div class="container">
    <div class="section-head">
      <span class="section-kicker">Preguntas frecuentes</span>
      <h2>Respuestas claras para avanzar sin dudas.</h2>
    </div>
    <div class="faq-list">
      @for (item of faqs; track item.question) {
        <article class="card">
          <h3>{{ item.question }}</h3>
          <p>{{ item.answer }}</p>
        </article>
      }
    </div>
  </div>
</section>
