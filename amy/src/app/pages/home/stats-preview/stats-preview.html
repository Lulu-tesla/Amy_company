<section class="section">
  <div class="container">
    <div class="grid grid-4 stats-grid">
      @for (item of stats; track item.title) {
        <article class="card feature-card">
          <h3>{{ item.title }}</h3>
          <p>{{ item.text }}</p>
        </article>
      }
    </div>
  </div>
</section>
