<section class="section soft-band">
  <div class="container">
    <div class="section-head">
      <span class="section-kicker">Testimonios</span>
      <h2>Clientes que valoran claridad y resultados.</h2>
    </div>
    <div class="grid grid-2">
      @for (item of testimonials; track item.author) {
        <article class="card testimonial-card">
          <p>"{{ item.quote }}"</p>
          <strong>{{ item.author }}</strong>
        </article>
      }
    </div>
  </div>
</section>
