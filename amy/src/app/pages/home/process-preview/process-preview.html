<section class="section soft-band">
  <div class="container">
    <div class="section-head">
      <span class="section-kicker">Proceso</span>
      <h2>Menos ruido, más avance.</h2>
    </div>
    <div class="grid grid-2">
      @for (step of steps; track step.title) {
        <article class="card feature-card">
          <span class="icon-badge">0{{ $index + 1 }}</span>
          <h3>{{ step.title }}</h3>
          <p>{{ step.text }}</p>
        </article>
      }
    </div>
  </div>
</section>
