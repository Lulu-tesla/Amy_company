  RECOMENDACION DE DISEÑO: Diseño minimalista: un spinner muy fino o una animación del isotipo (logo) de la empresa pulsando. Debe soportar modo pantalla completa (overlay) o local dentro de un div.
  PROMPT ADICIONAL: "Diseña un loader moderno animando el logotipo de Amy Company con un efecto de latido, rodeado de un círculo de progreso SVG que gire suavemente. Añade un @Input para modo fullscreen."
-->
<!--
  ARCHIVO: loader.html

  RESPONSABILIDAD:
  Template del componente Loader. Muestra una animaciÃ³n de carga
  tipo spinner (circular) o skeleton (placeholder rectangular).

  DEBE CONTENER:
  - Condicional para tipo spinner o skeleton
  - Clases dinÃ¡micas para tamaÃ±o

  NO DEBE CONTENER:
  - Texto de "Cargando" (lo agrega el padre si es necesario)
-->

<div
  class="loader"
  [class.loader--sm]="size() === 'sm'"
  [class.loader--md]="size() === 'md'"
  [class.loader--lg]="size() === 'lg'"
  role="status"
  aria-label="Cargando"
>
  @if (type() === 'spinner') {
    <div class="loader__spinner">
      <svg viewBox="0 0 50 50" class="loader__svg">
        <circle cx="25" cy="25" r="20" fill="none" stroke-width="4" class="loader__circle" />
      </svg>
    </div>
  } @else {
    <div class="loader__skeleton">
      <div class="loader__skeleton-line loader__skeleton-line--short"></div>
      <div class="loader__skeleton-line loader__skeleton-line--long"></div>
      <div class="loader__skeleton-line loader__skeleton-line--medium"></div>
    </div>
  }
</div>
