<!-- 
  RECOMENDACION DE DISEÑO: Fondo overlay negro semitransparente con desenfoque de fondo (backdrop-filter: blur). Tarjeta central con animación fluida de entrada (escala desde 0.95 o slide-up).
  PROMPT ADICIONAL: "Implementa un modal accesible con un overlay desenfocado. Debe cerrarse al hacer clic en el fondo exterior (backdrop) o presionar ESC, y debe tener una animación de entrada 'slide-up' y 'fade-in'."
-->
<!--
  ARCHIVO: modal.html

  RESPONSABILIDAD:
  Template del componente Modal. Muestra un overlay con una ventana modal centrada.
  Incluye tÃ­tulo, contenido proyectado y botÃ³n de cierre.

  DEBE CONTENER:
  - Backdrop con evento de clic
  - Contenedor del modal con tÃ­tulo y botÃ³n cerrar
  - ng-content para contenido personalizado

  NO DEBE CONTENER:
  - Contenido especÃ­fico (se proyecta via ng-content)
  - Estilos inline
-->

@if (isOpen()) {
  <div class="modal__backdrop" (click)="onBackdropClick($event)">
    <div class="modal__container" role="dialog" aria-modal="true" [attr.aria-label]="title()">
      <div class="modal__header">
        <h3 class="modal__title">{{ title() }}</h3>
        <button class="modal__close" (click)="close()" aria-label="Cerrar modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="modal__body">
        <ng-content />
      </div>
    </div>
  </div>
}
