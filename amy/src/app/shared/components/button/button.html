<!--
  ARCHIVO: button.html

  RESPONSABILIDAD:
  Template del componente Button. Renderiza un <a> si se proporcionÃ³ href,
  o un <button> en caso contrario. Aplica clases CSS dinÃ¡micas segÃºn variant y size.

  DEBE CONTENER:
  - Condicional @if para elegir entre <a> y <button>
  - Clases dinÃ¡micas para variant y size
  - Atributos de accesibilidad

  NO DEBE CONTENER:
  - LÃ³gica compleja o llamadas a mÃ©todos pesados
  - Estilos inline
-->

@if (href()) {
  <a
    [href]="href()"
    class="btn"
    [class.btn--primary]="variant() === 'primary'"
    [class.btn--secondary]="variant() === 'secondary'"
    [class.btn--outline]="variant() === 'outline'"
    [class.btn--ghost]="variant() === 'ghost'"
    [class.btn--sm]="size() === 'sm'"
    [class.btn--md]="size() === 'md'"
    [class.btn--lg]="size() === 'lg'"
    [class.btn--disabled]="disabled()"
    [attr.aria-disabled]="disabled()"
    [attr.tabindex]="disabled() ? -1 : 0"
  >
    {{ label() }}
  </a>
} @else {
  <button
    class="btn"
    [type]="type()"
    [disabled]="disabled()"
    [class.btn--primary]="variant() === 'primary'"
    [class.btn--secondary]="variant() === 'secondary'"
    [class.btn--outline]="variant() === 'outline'"
    [class.btn--ghost]="variant() === 'ghost'"
    [class.btn--sm]="size() === 'sm'"
    [class.btn--md]="size() === 'md'"
    [class.btn--lg]="size() === 'lg'"
  >
    {{ label() }}
  </button>
}
